<meta name="apple-mobile-web-app-title" content="Pb Garden 79">
<script>
  // Địa chỉ QR cố định /c/C001 → trang chính /?c=C001 (GitHub Pages không có máy chủ định tuyến).
  // Gõ /BDK, /Bdk… (sai chữ hoa) → bảng điều khiển chủ shop /bdk/
  var m = location.pathname.match(/^\/c\/([A-Za-z0-9]{1,10})\/?$/);
  location.replace(/^\/bdk\b/i.test(location.pathname) ? '/bdk/' : m ? '/?c=' + m[1].toUpperCase() : '/');
</script>
