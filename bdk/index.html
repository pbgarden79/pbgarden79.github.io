<!DOCTYPE html>

[hidden]{display:none!important}
.dn{max-width:380px;margin:12vh auto;padding:0 16px}

.dn label{display:block;font-size:13px;color:var(--phu);margin:14px 0 4px}
.dn input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--vien);border-radius:8px;background:#fff}
.dn button{width:100%;margin-top:16px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--xanh);color:#fff;cursor:pointer}
.dn .phu-nut{background:none;color:var(--phu);font-weight:400;margin-top:8px}
.dn img{display:block;width:200px;height:200px;margin:12px auto;background:#fff}
.dn code{display:block;word-break:break-all;font-size:13px;background:#eef0ec;padding:8px;border-radius:8px}
.dn .loi{margin-top:12px}
nav .thoat{margin-top:18px;opacity:.8}
</style>
</head>
<body>
<div id="dang-nhap"></div>
<div class="khung" id="bang" hidden>
<nav id="menu">
  <div class="ten">🌿 Pb Garden 79</div>

  <button data-man="trang_chu">🏠 Trang chủ</button>
  <div class="nhom">VƯỜN</div>
  <button data-man="phong">🌡️ Phòng trồng</button>

  <button data-man="viec">📋 Việc cần làm</button>
  <button data-man="nhat_ky">📜 Nhật ký</button>
  <button class="thoat" id="thoat">🚪 Đăng xuất</button>
  <div class="sau">Số liệu gửi từ hệ thống mỗi 15 phút. Giai đoạn 2 sẽ thêm: Lịch đăng, Kho ảnh, Combo, Nguồn hàng, Sổ sách.</div>
</nav>
