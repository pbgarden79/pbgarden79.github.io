<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PKD Nha Trang">
<title>Bảng điều hành PKD Nha Trang</title>
<style>
#dang-nhap .dn{max-width:380px;margin:12vh auto;padding:0 16px;font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;color:#13212E}
#dang-nhap h1{font-size:22px;margin:0 0 4px}
#dang-nhap .nhan{color:#5A6B7B;margin:0}
#dang-nhap label{display:block;font-size:13px;color:#5A6B7B;margin:14px 0 4px}
#dang-nhap input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #D6DEE5;border-radius:8px;background:#fff}
#dang-nhap button{width:100%;margin-top:16px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:#0D5C91;color:#fff;cursor:pointer}
#dang-nhap .phu-nut{background:none;color:#5A6B7B;font-weight:400;margin-top:8px}
#dang-nhap .loi{margin-top:12px;color:#BE3B26}
</style>
</head>
<body>
<div id="dang-nhap"></div>
<div id="cv-app" hidden>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F5; --panel:#FFFFFF; --ink:#13212E; --muted:#5A6B7B; --line:#D6DEE5;
  --accent:#0D5C91; --accent-soft:#DCEAF5;
  --good:#1E8A57; --good-soft:#DDF1E6; --warn:#B7790F; --warn-soft:#FBEFD6; --bad:#BE3B26; --bad-soft:#F8E0DB;
  --track:#E1E8EE;
  /* màu biểu đồ – bảng màu chuẩn (thứ tự cố định: xanh, cam, ngọc, vàng) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --grid:#E3E9EE; --axis:#C3CDD6;
  --st-good:#0ca30c; --st-warn:#fab219; --st-bad:#d03b3b;
  --f-num:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E161E; --panel:#16212C; --ink:#E6EDF3; --muted:#93A4B4; --line:#263544;
    --accent:#5AA9E0; --accent-soft:#183247;
    --good:#4CC28A; --good-soft:#163527; --warn:#E5B04A; --warn-soft:#3A2D12; --bad:#F07A63; --bad-soft:#3D1D17;
    --track:#22313F;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --grid:#22313F; --axis:#34475A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E161E; --panel:#16212C; --ink:#E6EDF3; --muted:#93A4B4; --line:#263544;
  --accent:#5AA9E0; --accent-soft:#183247;
  --good:#4CC28A; --good-soft:#163527; --warn:#E5B04A; --warn-soft:#3A2D12; --bad:#F07A63; --bad-soft:#3D1D17;
  --track:#22313F;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --grid:#22313F; --axis:#34475A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-num);font-weight:700;font-size:30px;letter-spacing:.3px;margin:0;text-wrap:balance;line-height:1.1}
.sub{color:var(--muted);font-size:12.5px}
.stamp{font-size:12px;color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
@media (min-width:860px){.grid.two{grid-template-columns:1fr 1fr}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-family:var(--f-num);font-weight:600;font-size:19px;letter-spacing:.4px;text-transform:uppercase;margin:0;color:var(--accent)}
h3.ct{font-size:13px;font-weight:600;margin:6px 0 0;color:var(--ink)}
h3.ct span{font-weight:400;color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.kpi .v{font-family:var(--f-num);font-size:32px;font-weight:700;line-height:1}
.kpi .v small{font-size:18px;color:var(--muted);font-weight:600}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.2px}
.kpi.good{border-color:var(--good)} .kpi.warn{border-color:var(--warn)} .kpi.bad{border-color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
table.tv td,table.tv th{padding:7px 6px;white-space:nowrap}
table.tv td.wrap{white-space:normal;min-width:150px}
details.kd{border-top:1px solid var(--line)} details.kd summary{display:flex;justify-content:space-between;padding:9px 2px;cursor:pointer}
details.more>summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;padding:4px 0}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}
ol.todo{margin:0;padding-left:20px;display:grid;gap:8px}
ol.todo li span{display:block;color:var(--muted);font-size:12px}
.foot{color:var(--muted);font-size:12px;text-align:center}
.err{background:var(--bad-soft);color:var(--bad);padding:12px;border-radius:8px}
nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.jump::-webkit-scrollbar{display:none}
nav.jump a{flex:none;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
nav.jump a b{color:var(--bad);font-weight:700;margin-left:4px}
section.panel{scroll-margin-top:60px}
a{color:var(--accent)}
.today{border-left:4px solid var(--accent)}
.today ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.today li{display:flex;gap:10px;align-items:flex-start}
.today li .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--accent)}
.today li .dot.bad{background:var(--bad)} .today li .dot.warn{background:var(--warn)}
.today li a{color:var(--ink);text-decoration:none} .today li small{display:block;color:var(--muted);font-size:12px}
.mails{display:grid;gap:10px}
.mails,.mail,.mail>*{min-width:0}
.mail{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;overflow-wrap:anywhere}
.mail.hot{border-left:3px solid var(--bad)}
.mail .t{font-weight:600;line-height:1.35}
.mail .m{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
.mail details summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mail details[open] summary{display:block;-webkit-line-clamp:unset}
.mail details summary::-webkit-details-marker{display:none}
.rows{display:grid;gap:6px} .rows div{display:flex;gap:10px;font-size:13px} .rows b{flex:none;min-width:86px}
/* ---- biểu đồ ---- */
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.chart text.ink{fill:var(--ink);font-weight:600}
.chart text.inv{fill:#fff;font-weight:600}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart .ref{stroke:var(--ink);stroke-width:1.5;opacity:.55}
.chart [data-tip]{cursor:default}
.chart .hit{fill:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;max-width:260px}
.tip b{font-weight:600}
.cgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.cgrid.two{grid-template-columns:1fr 1fr}}
@media (max-width:560px){
  body{font-size:14.5px}
  .wrap{gap:12px;padding-block:10px 32px}
  h1{font-size:23px} .stamp{text-align:left}
  section.panel{padding:13px;border-radius:12px;gap:10px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px 12px}
  .kpi .v{font-size:28px}
  th,td{padding:7px 6px}
  .grid{gap:12px}
}
</style>

<div class="wrap" id="app">
  <header>
    <div>
      <h1>PKD Hyundai Nha Trang</h1>
      <div class="sub">Bảng điều hành · Nha Trang + Phan Rang · VC037</div>
    </div>
    <div class="stamp" id="stamp">Đang tải số liệu…</div>
  </header>
  <nav class="jump" id="jump" aria-label="Chuyển mục"></nav>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const fmt = n => n == null ? '—' : Math.round(n).toLocaleString('vi-VN');
const tr = n => n == null ? '—' : (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tr';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ================= BIỂU ĐỒ (SVG tự vẽ theo bề rộng khung) ================= */
const CHARTS = [];
const drawOne = (d, fn) => { const w = Math.max(240, Math.floor(d.clientWidth || d.parentElement?.clientWidth || 600)); if (d._w === w) return; d._w = w; d.innerHTML = fn(w); };
// mỗi biểu đồ tự vẽ lại khi bề rộng khung đổi (xoay điện thoại, thu nhỏ cửa sổ) → chữ luôn đúng cỡ
const RO = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(es => es.forEach(e => { const c = CHARTS.find(x => x[0] === e.target); if (c) drawOne(c[0], c[1]); })) : null;
function chart(fn) { const d = el('<div class="chart"></div>'); CHARTS.push([d, fn]); if (RO) RO.observe(d); return d; }
function drawAll() { CHARTS.forEach(([d, fn]) => drawOne(d, fn)); }
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawAll, 150); });
const tipAttr = s => ` data-tip="${esc(s)}"`;
const txtW = s => String(s).length * 6.6;
const niceMax = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = [1, 2, 2.5, 5, 10].find(k => k * p >= v); return m * p; };
// thanh ngang: đầu bo tròn 4px, gốc vuông
const hPath = (x, y, w, h, r = 4, round = true) => { if (w <= 0) return ''; if (!round || w < r) return `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`; return `<path d="M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 -${r},${r}h-${w - r}z"/>`; };
// cột đứng: đỉnh bo tròn 4px
const vPath = (x, y, w, h, r = 4, round = true) => { if (h <= 0) return ''; if (!round || h < r) return `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`; return `<path d="M${x},${y + h}v-${h - r}a${r},${r} 0 0 1 ${r},-${r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - r}z"/>`; };
const legend = items => `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join('')}</div>`;

// 1 thanh xếp chồng trên thang 0..max, có các mốc
// fmtV: định dạng số riêng (vd triệu đồng) – mặc định số nguyên
const stackBar = o => stackBar0({ ...o, marks: o.marks || [], unit: o.unit || '', fmt: o.fmtV || fmt });
function stackBar0({ max, segs, marks, unit, fmt }) {
  return w => {
    const H = 24, top = marks.length ? 22 : 4, h = top + H + (marks.length ? 22 : 6), X = v => v / max * w;
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img"><g><rect x="0" y="${top}" width="${w}" height="${H}" rx="4" style="fill:var(--track)"/>`;
    let x = 0; const shown = segs.filter(g => g.v > 0);
    shown.forEach((g, i) => {
      const ww = Math.max(2, X(g.v)) - (i < shown.length - 1 ? 2 : 0);
      s += `<g style="fill:${g.color}"${tipAttr(`<b>${g.label}</b>: ${fmt(g.v)}${unit}`)}>${hPath(x, top, ww, H, 4, i === shown.length - 1)}</g>`;
      if (ww > txtW(g.v) + 12) s += `<text class="inv" x="${x + ww / 2}" y="${top + H / 2 + 4}" text-anchor="middle">${fmt(g.v)}</text>`;
      x += ww + 2;
    });
    let lastT = -99, lastB = -99; // bỏ bớt nhãn khi các mốc quá sát nhau (điện thoại)
    marks.forEach(m => { const mx = Math.min(w - 1, X(m.v)), lt = String(m.label), lb = fmt(m.v), anc = mx + txtW(lt) / 2 > w ? 'end' : 'middle';
      s += `<line class="ref" x1="${mx}" x2="${mx}" y1="${top - 5}" y2="${top + H + 5}"${tipAttr(`<b>Mốc ${esc(lt)}</b>: ${lb}${unit}`)}/>`;
      if (mx - lastT > txtW(lt) + 6) { s += `<text x="${mx}" y="${top - 9}" text-anchor="${anc}">${esc(lt)}</text>`; lastT = mx; }
      if (mx - lastB > txtW(lb) + 8) { s += `<text class="ink" x="${mx}" y="${top + H + 18}" text-anchor="${anc}">${lb}</text>`; lastB = mx; } });
    return s + '</g></svg>';
  };
}
// cột đứng (xếp chồng nhiều chuỗi), nhãn tổng trên đỉnh, đường tham chiếu tùy chọn
function columns({ cats, series, h = 190, fmtV = fmt, ref, tipFn }) {
  return w => {
    const L = 34, R = 6, T = 18, B = 24, pw = w - L - R, ph = h - T - B;
    const tot = cats.map((_, i) => series.reduce((a, s) => a + (s.values[i] || 0), 0));
    const top = Math.max(...tot, ref ? ref.v : 0, 1), st = niceMax(top / 4), mx = st * Math.ceil(top / st), Y = v => T + ph - v / mx * ph;
    const band = pw / cats.length, bw = Math.min(24, band * 0.6);
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
    for (let v = 0; v <= mx + 1e-9; v += st) { const y = Y(v); s += `<line class="${v ? 'gl' : 'ax'}" x1="${L}" x2="${w - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
    const step = Math.max(1, Math.ceil(cats.length / Math.floor(pw / 46)));
    // nhãn trên đỉnh cột: hiện hết nếu đủ chỗ; chật thì chỉ cột cao nhất + cột mới nhất
    const roomy = band >= Math.max(...tot.map(v => txtW(fmtV(v)))) + 6, iMax = tot.indexOf(Math.max(...tot)), iLast = tot.length - 1;
    cats.forEach((c, i) => {
      const cx = L + band * i + band / 2, x0 = cx - bw / 2; let y = T + ph; const vis = series.filter(sr => (sr.values[i] || 0) > 0);
      vis.forEach((sr, j) => { const v = sr.values[i]; let hh = v / mx * ph; const last = j === vis.length - 1; const gap = last ? 0 : 2; s += `<g style="fill:${sr.color}">${vPath(x0, y - hh, bw, hh - gap > 0 ? hh - gap : hh, 4, last)}</g>`; y -= hh; });
      if (tot[i] > 0 && (roomy || i === iMax || i === iLast)) s += `<text class="ink" x="${cx}" y="${Y(tot[i]) - 5}" text-anchor="middle">${fmtV(tot[i])}</text>`;
      if ((i % step === 0 && (i + step <= iLast || step === 1)) || i === iLast) s += `<text x="${cx}" y="${h - 6}" text-anchor="middle">${esc(c)}</text>`;
      const tip = tipFn ? tipFn(i) : `<b>${esc(c)}</b><br>` + series.map(sr => `${esc(sr.name)}: ${fmtV(sr.values[i] || 0)}`).join('<br>');
      s += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${ph}"${tipAttr(tip)}/>`;
    });
    if (ref) { const y = Y(ref.v); s += `<line class="ref" x1="${L}" x2="${w - R}" y1="${y}" y2="${y}"/><text class="ink" x="${w - R}" y="${y - 5}" text-anchor="end">${esc(ref.label)}</text>`; }
    return s + '</svg>';
  };
}
// thanh ngang theo hàng: nhãn trái, giá trị cuối thanh, vạch chỉ tiêu, đường tham chiếu
function hbars({ rows, max, fmtV = fmt, refs = [], labelW, rowH = 30, total }) {
  return w => {
    const lw = labelW || Math.min(170, Math.max(96, Math.round(w * 0.34))), vr = 46, pw = w - lw - vr, T = refs.length ? 18 : 2;
    const mx = max || niceMax(Math.max(...rows.map(r => Math.max(r.v || 0, r.target || 0, r.total || 0)), 1)), X = v => lw + Math.min(1, v / mx) * pw;
    const h = T + rows.length * rowH + 4;
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img"><line class="ax" x1="${lw}" x2="${lw}" y1="${T - 2}" y2="${h - 2}"/>`;
    refs.forEach(r => { const x = X(r.v); s += `<line class="gl" x1="${x}" x2="${x}" y1="${T - 4}" y2="${h - 2}" style="stroke:var(--axis)"/><text x="${x}" y="${T - 7}" text-anchor="middle">${esc(r.label)}</text>`; });
    rows.forEach((r, i) => {
      const y = T + i * rowH, bh = Math.min(16, rowH - 12), by = y + (rowH - bh) / 2;
      const lab = r.label.length > lw / 6.4 ? r.label.slice(0, Math.floor(lw / 6.4) - 1) + '…' : r.label;
      s += `<text class="${r.strong ? 'ink' : ''}" x="${lw - 8}" y="${by + bh / 2 + 4}" text-anchor="end">${esc(lab)}</text>`;
      if (r.total) s += `<rect x="${lw}" y="${by}" width="${X(r.total) - lw}" height="${bh}" rx="3" style="fill:var(--track)"/>`;
      if ((r.v || 0) > 0) s += `<g style="fill:${r.color || 'var(--s1)'}">${hPath(lw, by, Math.max(3, X(r.v) - lw), bh)}</g>`;
      if (r.target) { const tx = X(r.target); s += `<line x1="${tx}" x2="${tx}" y1="${by - 4}" y2="${by + bh + 4}" style="stroke:var(--ink);stroke-width:2"/>`; }
      // nhãn số ngay sau đầu thanh; nếu đụng vạch chỉ tiêu thì lùi ra sau vạch
      let endX = Math.max(X(r.v || 0), r.total ? X(r.total) : 0);
      const vt = String(r.valText ?? fmtV(r.v || 0));
      if (r.target) { const tx = X(r.target); if (tx >= endX - 4 && tx <= endX + 10 + txtW(vt)) endX = tx; }
      s += `<text class="ink" x="${Math.min(endX + 6, w - 2)}" y="${by + bh / 2 + 4}" ${endX + 6 > w - vr + 30 ? 'text-anchor="end"' : ''}>${esc(r.valText ?? fmtV(r.v || 0))}</text>`;
      s += `<rect class="hit" x="0" y="${y}" width="${w}" height="${rowH}"${tipAttr(r.tip || `<b>${esc(r.label)}</b>: ${fmtV(r.v || 0)}`)}/>`;
    });
    return s + '</svg>';
  };
}
// chú thích nổi khi rê chuột / chạm
(() => {
  const tip = document.getElementById('tip');
  const show = e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }

    const dk = (K.diem || []).slice().sort((a, b) => b.diem - a.diem);
    if (dk.length) pk.appendChild(chart(hbars({ rows: dk.map(k => ({ label: k.ten, v: Math.round(k.diem * 1000) / 10, valText: pctK(k.diem), color: 'var(--s1)' })), max: 100, refs: [{ v: 60, label: '60%' }, { v: 85, label: '85%' }], fmtV: v => v + '%' })));
    pk.appendChild(el(`<div class="hint">Theo Google Sheet KPIS (${esc(K.sua_cuoi || '')}). ${K.chua_nhap ? 'Chưa có số: ' + esc(K.chua_nhap) + '. ' : ''}<a href="${esc(K.link)}">Mở KPIS</a></div>`));
    g2b.appendChild(pk);
    app.appendChild(g2b);
  }

  // ---- 3. Quảng cáo ----
  const thang = (today.getMonth() + 1) + '/' + today.getFullYear();
  const am = T.ads_thang[thang] || { chi_phi: 0, khach: 0 };
  const budget = D.ngan_sach_mkt || 0;
  const dim = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate(), pace = budget * today.getDate() / dim;
  const weeks = Object.keys(T.ads_tuan).sort((a, b) => +a.slice(1) - +b.slice(1));
  const full = weeks.filter(w => T.ads_tuan[w].chi_phi > 500000);
  const wLast = full[full.length - 1] || weeks[weeks.length - 1];
  const camps = Object.entries(T.ads_chien_dich).filter(([k]) => k.startsWith(wLast + ' ')).map(([k, v]) => ({ ten: k.split(' | ')[1], ...v })).filter(c => c.chi_phi > 0).sort((a, b) => b.chi_phi - a.chi_phi);
  const avg = camps.reduce((s, c) => s + c.chi_phi, 0) / Math.max(1, camps.reduce((s, c) => s + c.khach, 0));
  const verdict = c => { const cpl = c.khach ? c.chi_phi / c.khach : Infinity;
    if (!c.khach && c.chi_phi >= 150000) return ['bad', 'Dừng']; if (!c.khach) return ['warn', 'Theo dõi'];
    if (cpl > 1.5 * avg || (cpl > 80000 && c.chi_phi >= 300000)) return ['bad', 'Giảm']; if (cpl < 45000) return ['good', 'Tăng']; return ['info', 'Giữ']; };
  const pQ = el(`<section class="panel" id="qc"><h2>Quảng cáo Facebook – Nha Trang</h2>
    <div class="kpis">
      <div class="kpi"><div class="v">${tr(am.chi_phi)}</div><div class="l">Chi tháng · ${pct(am.chi_phi, budget)}% ngân sách</div></div>
      <div class="kpi"><div class="v">${am.khach}</div><div class="l">Khách nhắn tin tháng</div></div>
      <div class="kpi ${am.chi_phi / Math.max(1, am.khach) <= 50000 ? 'good' : 'warn'}"><div class="v">${fmt(am.chi_phi / Math.max(1, am.khach))}<small>đ</small></div><div class="l">Chi phí / khách</div></div>
    </div>
    <h3 class="ct">Ngân sách tháng ${esc(thang)} <span>· ${tr(budget)} · vạch = mức nên chi đến hôm nay</span></h3></section>`);
  pQ.appendChild(chart(stackBar({ max: budget || am.chi_phi || 1, segs: [{ label: 'Đã chi', v: am.chi_phi, color: 'var(--s1)' }], marks: budget ? [{ label: 'nên chi đến hôm nay', v: pace }] : [], fmtV: tr })));
  const days = Object.keys(T.ads_ngay).sort((a, b) => a.split('/').reverse().join('').localeCompare(b.split('/').reverse().join(''))).slice(-14);
  const dd = s => s.slice(0, 5);
  const qg = el('<div class="cgrid two"></div>');
  const q1 = el(`<div><h3 class="ct">Chi phí theo ngày <span>· triệu đồng</span></h3></div>`);
  q1.appendChild(chart(columns({ cats: days.map(dd), h: 170, fmtV: v => (v / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }), series: [{ name: 'Chi phí', color: 'var(--s1)', values: days.map(k => T.ads_ngay[k].chi_phi) }],
    tipFn: i => { const r = T.ads_ngay[days[i]]; return `<b>${esc(days[i])}</b><br>Chi: ${fmt(r.chi_phi)}đ<br>Khách: ${r.khach}<br>${r.khach ? fmt(r.chi_phi / r.khach) + 'đ/khách' : ''}`; } })));
  qg.appendChild(q1);
  const q2 = el(`<div><h3 class="ct">Khách nhắn tin theo ngày</h3></div>`);
  q2.appendChild(chart(columns({ cats: days.map(dd), h: 170, series: [{ name: 'Khách', color: 'var(--s3)', values: days.map(k => T.ads_ngay[k].khach) }],
    tipFn: i => { const r = T.ads_ngay[days[i]]; return `<b>${esc(days[i])}</b><br>Khách: ${r.khach}<br>Chi: ${fmt(r.chi_phi)}đ`; } })));
  qg.appendChild(q2); pQ.appendChild(qg);
  const qg2 = el('<div class="cgrid two"></div>');
  const q3 = el(`<div><h3 class="ct">Chi phí / khách theo chiến dịch – tuần ${esc(wLast.slice(1))} <span>· vạch = trung bình ${fmt(avg)}đ</span></h3></div>`);
  q3.appendChild(chart(hbars({ rows: camps.map(c => { const [cl, vt] = verdict(c); const cpl = c.khach ? c.chi_phi / c.khach : 0;
    return { label: c.ten.replace(/\s*T\d+$/, ''), v: c.khach ? cpl : 0, valText: c.khach ? fmt(cpl) + 'đ · ' + vt : '0 khách · ' + vt,
      color: cl === 'bad' ? 'var(--st-bad)' : cl === 'good' ? 'var(--st-good)' : 'var(--s1)',
      tip: `<b>${esc(c.ten)}</b><br>Chi ${fmt(c.chi_phi)}đ · ${c.khach} khách<br>Đề xuất: ${vt}` }; }), refs: [{ v: avg, label: 'TB' }], labelW: 120 })));
  q3.appendChild(el(legend([['var(--st-good)', 'Tăng'], ['var(--s1)', 'Giữ'], ['var(--st-bad)', 'Giảm / Dừng']])));
  qg2.appendChild(q3);
  const q4 = el(`<div><h3 class="ct">Khách theo tuần <span>· rê/chạm để xem chi phí</span></h3></div>`);
  q4.appendChild(chart(columns({ cats: weeks.map(w => 'T' + w.slice(1)), h: 170, series: [{ name: 'Khách', color: 'var(--s3)', values: weeks.map(w => T.ads_tuan[w].khach) }],
    tipFn: i => { const r = T.ads_tuan[weeks[i]]; return `<b>Tuần ${esc(weeks[i].slice(1))}</b><br>Khách: ${r.khach}<br>Chi: ${tr(r.chi_phi)}<br>${r.khach ? fmt(r.chi_phi / r.khach) + 'đ/khách' : ''}`; } })));
  qg2.appendChild(q4); pQ.appendChild(qg2);
  pQ.appendChild(el('<div class="hint">Không tính Tuyển dụng. Đề xuất để nhân viên MKT thực hiện sau khi anh/chị duyệt – trợ lý không tự đổi quảng cáo.</div>'));
  app.appendChild(pQ);

  // ---- Fanpage + Video ----
  const g3 = el('<div class="grid two"></div>');
  const fpD = T.fanpage_tuan || [];
  const pF = el(`<section class="panel" id="fanpage"><h2>Fanpage Nha Trang</h2><h3 class="ct">Bài thương hiệu đã đăng theo tuần <span>· quy định ≥ 1 bài/tuần</span></h3></section>`);
  pF.appendChild(chart(columns({ cats: fpD.map(f => 'T' + f.tuan), h: 150, ref: { v: 1, label: '1 bài' }, series: [{ name: 'Bài đăng', color: 'var(--s1)', values: fpD.map(f => +String(f.NT).split('/')[0] || 0) }],
    tipFn: i => `<b>Tuần ${fpD[i].tuan}</b><br>Nha Trang: ${esc(fpD[i].NT)}${fpD[i].canh_bao ? '<br>' + esc(fpD[i].canh_bao) : ''}` })));
  const thieu = fpD.filter(f => !(+String(f.NT).split('/')[0])).map(f => 'T' + f.tuan);
  pF.appendChild(el(`<div class="hint">${thieu.length ? '✕ Tuần chưa có bài: ' + thieu.join(', ') : '✔ Tuần nào cũng có bài'}</div>`));
  g3.appendChild(pF);
  const V = D.video;
  if (V) {
    const pV = el(`<section class="panel" id="video"><h2>Video & kịch bản</h2><h3 class="ct">Hoàn thành / được giao theo người <span>· tổng ${V.tong?.da_hoan_thanh ?? 0}/${V.tong?.tong_video ?? 0} video</span></h3></section>`);
    pV.appendChild(chart(hbars({ rows: (V.nhan_su || []).map(p => ({ label: p.ten, v: p.xong, total: p.nhan, valText: p.xong + '/' + p.nhan, tip: `<b>${esc(p.ten)}</b><br>Xong ${p.xong} / nhận ${p.nhan} (${pct(p.xong, p.nhan)}%)` })), max: Math.max(1, ...(V.nhan_su || []).map(p => p.nhan)) })));
    pV.appendChild(el(legend([['var(--s1)', 'Đã xong'], ['var(--track)', 'Chưa xong']])));
    const done = v => /hoàn thành/i.test(v.trang_thai), dt = s => { const [d, m, y] = String(s || '').split('/').map(Number); return y ? new Date(y, m - 1, d) : null; };
    const late = (V.viec || []).filter(v => !done(v) && dt(v.han) && dt(v.han) < today);
    pV.appendChild(el(`<div class="hint">${late.length ? '✕ Quá hạn: ' + late.map(v => esc(v.ma) + ' (' + esc(v.nguoi.split(' ').pop()) + ')').join(', ') + ' · ' : ''}Số liệu file đọc ${esc(V.doc_luc)} · <a href="${esc(V.link)}">Tiếp nhận kịch bản</a></div>`));
    g3.appendChild(pV);
  }
  app.appendChild(g3);

  // ---- Chờ duyệt ----
  const todo = [];
  TV.filter(x => x.co_kpis && x.hd_thang !== x.ky_trong_kpis && x.ky_trong_kpis != null).forEach(x => todo.push(`Cập nhật KPIS: ${esc(x.ten)} ký ${x.ky_trong_kpis} → ${x.hd_thang}<span>Đồng bộ ở lần "chạy báo cáo" tiếp theo</span>`));
  (D.de_xuat_bc_tuan || []).forEach(p => todo.push(`${esc(p.noi_dung)}<span>${esc(p.muc)} · ${esc(p.ly_do)}</span>`));
  app.appendChild(el(`<section class="panel" id="duyet"><h2>Việc chờ anh/chị duyệt</h2>
    ${todo.length ? '<ol class="todo">' + todo.map(t => '<li>' + t + '</li>').join('') + '</ol>' : '<div class="hint">Không có việc chờ duyệt.</div>'}
    <div class="hint">Duyệt bằng cách nhắn trong phiên "Trợ lý AI công việc".</div></section>`));

  // ---- Hôm nay cần làm (đầu trang) ----
  const hn = [...mailTodo];
  const thieu60 = Math.max(0, (ct.moc60 || 0) - bb);
  if (thieu60) hn.push({ c: 'warn', t: `Báo bán DMS còn thiếu ${thieu60} xe để đạt mốc 60%`, s: `Đang ${bb}/${ct.chi_tieu} (${pBB}%) · theo Tín Thanh`, h: '#tien-do' });
  if (A && (A.da_phan_chua_bao_ban || []).length) { const P = A.da_phan_chua_bao_ban; const tre = P.filter(x => x.so_ngay_phan >= 3).length;
    hn.push({ c: tre ? 'bad' : 'warn', t: `${P.length} xe đã phân khách chưa báo bán DMS${tre ? ` (${tre} xe đã quá 3 ngày)` : ''}`, s: P.map(x => esc(x.tvbh) + ' – ' + esc(x.model.split(' ')[0])).join(' · '), h: '#xe-phan' }); }
  const stopC = camps.filter(c => verdict(c)[1] === 'Dừng');
  if (stopC.length) hn.push({ c: 'bad', t: `${stopC.length} chiến dịch QC tốn tiền nhưng 0 khách`, s: stopC.map(c => esc(c.ten)).join(' · ') + ' · đề xuất dừng', h: '#qc' });
  if (quen.length) hn.push({ c: 'bad', t: `${quen.length} mục báo cáo nhân viên quá hạn cập nhật`, s: quen.map(t => esc(t.phu_trach) + ' – ' + esc(t.tab.replace(/_[A-ZÀ-Ỹ]+$/, '')) + ' (' + t.n + ' ngày)').join(' · '), h: '#nhan-vien' });
  if (todo.length) hn.push({ c: '', t: `${todo.length} việc chờ anh/chị duyệt`, s: 'Nhắn trong phiên Trợ lý AI để duyệt', h: '#duyet' });
  const first = app.querySelector('section.panel');
  app.insertBefore(el(`<section class="panel today" id="hom-nay"><h2>Hôm nay cần làm</h2>
    ${hn.length ? '<ul>' + hn.map(x => `<li><span class="dot ${x.c}"></span><a href="${x.h}">${x.t}<small>${x.s}</small></a></li>`).join('') + '</ul>' : '<div class="hint">Không có việc gấp.</div>'}</section>`), first);
  const nav = [['hom-nay', 'Hôm nay', hn.filter(x => x.c === 'bad').length], ['tien-do', 'Tiến độ'], ['xe-phan', 'Xe phân', ((A || {}).da_phan_chua_bao_ban || []).length], ['tvbh', 'TVBH'], ['du-bao', 'Khách Hot'], ['nhan-vien', 'Nhân viên', quen.length], ['kpis', 'KPIS'], ['qc', 'Quảng cáo'], ['fanpage', 'Fanpage'], ['video', 'Video'], ['mail', 'Mail', mailTodo.length], ['duyet', 'Duyệt', todo.length]]
    .filter(([id]) => document.getElementById(id));
  document.getElementById('jump').innerHTML = nav.map(([id, t, n]) => `<a href="#${id}">${t}${n ? '<b>' + n + '</b>' : ''}</a>`).join('');
  // mail xuống sau phần số liệu (đã có trong "Hôm nay cần làm")
  const mailP = document.getElementById('mail'); if (mailP) app.insertBefore(mailP, document.getElementById('duyet'));
  app.appendChild(el(`<div class="foot">Nguồn: trang BC Tín Thanh (tự động), file Admin, BC TUẦN PKD, KPIS Google Sheet, mail Outlook (chỉ đọc) · Cập nhật ${esc(D.cap_nhat)}</div>`));
  requestAnimationFrame(drawAll);
}
</script>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
